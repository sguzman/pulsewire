name: Container packaging and smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          PULSEWIRE_POSTGRES_PASSWORD: 'ci-only:p@ss/word?#'
          PULSEWIRE_POSTGRES_HOST: ci-postgres
          PULSEWIRE_DOCKER_NETWORK: ci-only-existing-network
        run: |
          docker compose -f crates/fetcher/docker-compose.yml config --quiet
          docker compose -f crates/server/docker-compose.yml config --quiet
          # Verify the default fetcher publishes no metrics port.
          docker compose -f crates/fetcher/docker-compose.yml config --format json | jq -e '(.services.fetcher.ports // [] | length) == 0'
          docker compose -f crates/server/docker-compose.yml config --format json | jq -e '(.services.server.ports | length) == 1 and all(.services.server.ports[]; .host_ip == "127.0.0.1")'
          grep -q '^enabled = false$' crates/fetcher/res/docker.toml
          grep -q '^bind    = "127.0.0.1:9898"$' crates/fetcher/res/docker.toml
          bash -n tests/pw023-ingress-smoke.sh
          # Compose overlays must clear direct credential environment values.
          printf '%s\n' 'ci-example-only' > "$RUNNER_TEMP/pw023-compose-secret"
          chmod 0644 "$RUNNER_TEMP/pw023-compose-secret"
          for service in fetcher server; do
            PULSEWIRE_POSTGRES_PASSWORD_SOURCE="$RUNNER_TEMP/pw023-compose-secret" \
              docker compose -f "crates/$service/docker-compose.yml" \
                -f "crates/$service/docker-compose.secrets.yml" config --quiet
            PULSEWIRE_POSTGRES_PASSWORD_SOURCE="$RUNNER_TEMP/pw023-compose-secret" \
              docker compose -f "crates/$service/docker-compose.yml" \
                -f "crates/$service/docker-compose.secrets.yml" config --format json | \
              jq -e --arg service "$service" '.services[$service].environment |
                .PULSEWIRE_POSTGRES_PASSWORD == "" and
                .PULSEWIRE_POSTGRES_PASSWORD_FILE == "/run/secrets/pulsewire_postgres_password"'
          done
          # PW-023 metrics profile: no public listener, explicit token file,
          # Prometheus is attached only to the internal monitoring bridge.
          PULSEWIRE_METRICS_CONFIG_SOURCE="$GITHUB_WORKSPACE/crates/fetcher/res/docker.toml" \
          PULSEWIRE_METRICS_TOKEN_SOURCE="$RUNNER_TEMP/pw023-compose-secret" \
            docker compose -f crates/fetcher/docker-compose.yml \
              -f crates/fetcher/docker-compose.metrics.yml config --format json | \
              jq -e '
                (.services.fetcher.ports // [] | length) == 0 and
                (.services.prometheus.ports // [] | length) == 0 and
                (.services.fetcher.networks | has("pulsewire_metrics_private")) and
                (.services.prometheus.networks | has("pulsewire_services") | not) and
                .networks.pulsewire_metrics_private.internal == true and
                .services.fetcher.environment.PULSEWIRE_METRICS_TOKEN_FILE == "/run/secrets/pulsewire_metrics_token"
              '
      - name: Build fetcher and server images
        run: |
          docker build --file crates/fetcher/Dockerfile --tag pulsewire-fetcher:ci .
          docker build --file crates/server/Dockerfile --tag pulsewire-server:ci .
      - name: Verify non-root images and slim catalog
        run: |
          set -euo pipefail
          test "$(docker image inspect pulsewire-fetcher:ci --format '{{.Config.User}}')" = '65532:65532'
          test "$(docker image inspect pulsewire-server:ci --format '{{.Config.User}}')" = '65532:65532'
          mkdir -p "$RUNNER_TEMP/pulsewire-check"
          fetcher_id="$(docker create pulsewire-fetcher:ci)"
          docker cp "$fetcher_id:/app/res/feeds" "$RUNNER_TEMP/pulsewire-check/feeds"
          docker rm "$fetcher_id"
          test -f "$RUNNER_TEMP/pulsewire-check/feeds/news/nytimes.toml"
          test ! -e "$RUNNER_TEMP/pulsewire-check/feeds/youtube.com"
          test ! -e "$RUNNER_TEMP/pulsewire-check/feeds/podcasts"
          server_id="$(docker create pulsewire-server:ci)"
          docker cp "$server_id:/app/res/sql/postgres/schema.sql" "$RUNNER_TEMP/pulsewire-check/schema.sql"
          docker rm "$server_id"
          test -s "$RUNNER_TEMP/pulsewire-check/schema.sql"
      - name: Smoke against disposable PostgreSQL
        env:
          TEST_DB_PASSWORD: 'ci-only:p@ss/word?#'
          TEST_ADMIN_PASSWORD: 'ci-only-administrator-passphrase'
        run: |
          set -euo pipefail
          cleanup() {
            status=$?
            if test "$status" -ne 0; then
              # On a failing synthetic fixture, preserve the last
              # SQLite server diagnostics before removing containers.
              docker logs --tail 120 pulsewire-ci-sqlite-server 2>&1 || true
            fi
            docker rm -f pulsewire-ci-fetcher pulsewire-ci-rss pulsewire-ci-server pulsewire-ci-postgres \
              pulsewire-ci-metrics pulsewire-ci-prometheus \
              pulsewire-ci-sqlite-fetcher pulsewire-ci-sqlite-server \
              pulsewire-ci-secret-server >/dev/null 2>&1 || true
            docker network rm pulsewire-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create pulsewire-ci
          docker run -d --name pulsewire-ci-postgres --network pulsewire-ci --network-alias ci-postgres \
            -e POSTGRES_USER=admin -e POSTGRES_PASSWORD="$TEST_DB_PASSWORD" -e POSTGRES_DB=data \
            postgres:16-alpine
          for i in {1..40}; do
            if docker exec pulsewire-ci-postgres pg_isready -U admin -d data >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec pulsewire-ci-postgres pg_isready -U admin -d data
          # Verify Docker DNS within the actual isolated service network.
          docker exec pulsewire-ci-postgres pg_isready -h ci-postgres -U admin -d data

          # Test XDG discovery in the actual scratch images, without
          # CONFIG_PATH or SERVER_CONFIG_PATH. Keep all contents disposable.
          mkdir -p "$RUNNER_TEMP/pulsewire-xdg/pulsewire/fetcher/feeds" \
                   "$RUNNER_TEMP/pulsewire-xdg/pulsewire/server"
          cp crates/fetcher/res/docker.toml \
            "$RUNNER_TEMP/pulsewire-xdg/pulsewire/fetcher/config.toml"
          cp crates/fetcher/res/domains.toml \
            "$RUNNER_TEMP/pulsewire-xdg/pulsewire/fetcher/domains.toml"
          cp crates/fetcher/res/categories.toml \
            "$RUNNER_TEMP/pulsewire-xdg/pulsewire/fetcher/categories.toml"
          cp crates/server/res/docker.toml \
            "$RUNNER_TEMP/pulsewire-xdg/pulsewire/server/config.toml"
          # The loader intentionally rejects empty feed catalogs.
          cat > "$RUNNER_TEMP/pulsewire-xdg/pulsewire/fetcher/feeds/ci.toml" <<'EOF'
          [[feeds]]
          id = "pulsewire-xdg-feed"
          url = "https://example.org/feed.xml"
          category = "news"
          EOF
          # A normal /usr/local/share install should work without a
          # SCHEMAS_DIR override or a build-tree source directory.
          mkdir -p "$RUNNER_TEMP/pulsewire-installed-schemas"
          cp -R crates/schemas/fetcher "$RUNNER_TEMP/pulsewire-installed-schemas/fetcher"
          cp -R crates/schemas/server "$RUNNER_TEMP/pulsewire-installed-schemas/server"
          # Server SQL migrations also belong to the installed runtime
          # schema tree, not the directory containing config.toml.
          cp -R crates/server/res/sql "$RUNNER_TEMP/pulsewire-installed-schemas/server/sql"
          mkdir -p "$RUNNER_TEMP/pulsewire-smoke/news"
          cat > "$RUNNER_TEMP/pulsewire-smoke/news/ci.toml" <<'EOF'
          [[feeds]]
          id = "pulsewire-ci-feed"
          url = "https://example.org/feed.xml"
          category = "news"
          EOF
          docker run --rm --network pulsewire-ci \
            -e PULSEWIRE_POSTGRES_PASSWORD="$TEST_DB_PASSWORD" \
            -e PULSEWIRE_POSTGRES_HOST=ci-postgres \
            -e PULSEWIRE_ALLOW_PRIVATE_FEEDS=1 \
            -e CONFIG_PATH= \
            -e SCHEMAS_DIR= \
            -e XDG_CONFIG_HOME=/app/ci-xdg \
            -e FEEDS_DIR=/app/ci-xdg/pulsewire/fetcher/feeds \
            -v "$RUNNER_TEMP/pulsewire-xdg:/app/ci-xdg:ro" \
            -v "$RUNNER_TEMP/pulsewire-installed-schemas:/usr/local/share/pulsewire/schemas:ro" \
            pulsewire-fetcher:ci --ingest-benchmark 1
          docker run --rm --network pulsewire-ci \
            -e PULSEWIRE_POSTGRES_PASSWORD="$TEST_DB_PASSWORD" \
            -e PULSEWIRE_POSTGRES_HOST=ci-postgres \
            -e PULSEWIRE_ALLOW_PRIVATE_FEEDS=1 \
            -e SERVER_CONFIG_PATH= \
            -e SCHEMAS_DIR= \
            -e XDG_CONFIG_HOME=/app/ci-xdg \
            -v "$RUNNER_TEMP/pulsewire-xdg:/app/ci-xdg:ro" \
            -v "$RUNNER_TEMP/pulsewire-installed-schemas:/usr/local/share/pulsewire/schemas:ro" \
            -e PULSEWIRE_BOOTSTRAP_USERNAME=owner \
            -e PULSEWIRE_BOOTSTRAP_PASSWORD="$TEST_ADMIN_PASSWORD" \
            pulsewire-server:ci --bootstrap-admin
          docker run -d --name pulsewire-ci-server --network pulsewire-ci \
            --memory 256m --memory-swap 256m --cpus 0.25 --pids-limit 128 \
            -p 127.0.0.1:18091:8091 \
            -e PULSEWIRE_POSTGRES_PASSWORD="$TEST_DB_PASSWORD" \
            -e PULSEWIRE_POSTGRES_HOST=ci-postgres \
            -e PULSEWIRE_ALLOW_PRIVATE_FEEDS=1 \
            -e SERVER_CONFIG_PATH= \
            -e SCHEMAS_DIR= \
            -e XDG_CONFIG_HOME=/app/ci-xdg \
            -v "$RUNNER_TEMP/pulsewire-xdg:/app/ci-xdg:ro" \
            -v "$RUNNER_TEMP/pulsewire-installed-schemas:/usr/local/share/pulsewire/schemas:ro" \
            pulsewire-server:ci
          # Inspect actual runtime enforcement, not only Compose declarations.
          test "$(docker inspect -f '{{.HostConfig.Memory}}:{{.HostConfig.MemorySwap}}:{{.HostConfig.NanoCpus}}:{{.HostConfig.PidsLimit}}' pulsewire-ci-server)" = '268435456:268435456:250000000:128'
          test "$(docker inspect -f '{{.HostConfig.NetworkMode}}' pulsewire-ci-server)" = 'pulsewire-ci'
          healthy=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18091/health >/dev/null 2>&1; then healthy=1; break; fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            docker logs pulsewire-ci-server
            exit 1
          fi
          # A live server is only ready if its actual DB is reachable.
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18091/ready)" = 200
          code="$(curl -sS -o "$RUNNER_TEMP/login.json" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"owner\",\"password\":\"$TEST_ADMIN_PASSWORD\"}" \
            http://127.0.0.1:18091/v1/auth/login)"
          test "$code" = 200
          grep -q '"token"' "$RUNNER_TEMP/login.json"
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"username":"stranger","password":"not-an-administrator-passphrase"}' \
            http://127.0.0.1:18091/v1/users)"
          test "$code" = 401
          test "$(docker port pulsewire-ci-server 8091/tcp)" = '127.0.0.1:18091'
          # Exercise the real GET -> XML parser -> PostgreSQL -> API path using
          # deterministic HTTP inside the isolated Docker network. No external RSS requests.
          docker run -d --name pulsewire-ci-rss --network pulsewire-ci --network-alias ci-rss \
            -v "$GITHUB_WORKSPACE/tests/fixtures/rss:/usr/share/nginx/html:ro" \
            nginx:alpine
          mkdir -p "$RUNNER_TEMP/pulsewire-real-feeds/news" \
                   "$RUNNER_TEMP/pulsewire-real-feeds/podcasts" \
                   "$RUNNER_TEMP/pulsewire-real-feeds/youtube.com"
          cat > "$RUNNER_TEMP/pulsewire-real-feeds/news/ci.toml" <<'EOF'
          [[feeds]]
          id = "pulsewire-ci-real-rss"
          url = "http://ci-rss/feed.xml"
          category = "news"
          base_poll_seconds = 1800
          EOF
          # These intentionally broken files prove disabled directories are
          # skipped before reading/parsing them, not merely filtered afterward.
          printf 'intentionally broken = [\n' > "$RUNNER_TEMP/pulsewire-real-feeds/podcasts/disabled.toml"
          printf 'intentionally broken = [\n' > "$RUNNER_TEMP/pulsewire-real-feeds/youtube.com/disabled.toml"
          docker run -d --name pulsewire-ci-fetcher --network pulsewire-ci \
            --memory 512m --memory-swap 512m --cpus 0.75 --pids-limit 256 \
            -e PULSEWIRE_POSTGRES_PASSWORD="$TEST_DB_PASSWORD" \
            -e PULSEWIRE_POSTGRES_HOST=ci-postgres \
            -e PULSEWIRE_ALLOW_PRIVATE_FEEDS=1 \
            -e FEEDS_DIR=/app/smoke-feeds \
            -v "$RUNNER_TEMP/pulsewire-real-feeds:/app/smoke-feeds:ro" \
            pulsewire-fetcher:ci
          test "$(docker inspect -f '{{.HostConfig.Memory}}:{{.HostConfig.MemorySwap}}:{{.HostConfig.NanoCpus}}:{{.HostConfig.PidsLimit}}' pulsewire-ci-fetcher)" = '536870912:536870912:750000000:256'
          test "$(docker inspect -f '{{.HostConfig.NetworkMode}}' pulsewire-ci-fetcher)" = 'pulsewire-ci'
          fetched=0
          for i in {1..45}; do
            items="$(docker exec -e PGPASSWORD="$TEST_DB_PASSWORD" pulsewire-ci-postgres \
              psql -U admin -d data -Atc "SELECT COUNT(*) FROM fetcher.feed_items WHERE feed_id = 'pulsewire-ci-real-rss'" 2>/dev/null || echo 0)"
            if [ "$items" -ge 2 ]; then fetched=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' pulsewire-ci-fetcher)" != true ]; then
              docker logs pulsewire-ci-fetcher
              exit 1
            fi
            sleep 2
          done
          if [ "$fetched" -ne 1 ]; then
            docker logs pulsewire-ci-fetcher
            exit 1
          fi
          docker stop pulsewire-ci-fetcher
          # PW-052: Prometheus scrapes an isolated, non-published metrics port.
          cp crates/fetcher/res/docker.toml "$RUNNER_TEMP/pulsewire-metrics.toml"
          sed -i \
            -e 's/^enabled = false$/enabled = true/' \
            -e 's/^bind    = "127.0.0.1:9898"$/bind    = "0.0.0.0:9898"/' \
            "$RUNNER_TEMP/pulsewire-metrics.toml"
          grep -q '^enabled = true$' "$RUNNER_TEMP/pulsewire-metrics.toml"
          grep -q '^bind    = "0.0.0.0:9898"$' "$RUNNER_TEMP/pulsewire-metrics.toml"
          # A non-loopback metrics bind without a valid token file
          # must refuse startup even when PostgreSQL is reachable.
          if docker run --rm --network pulsewire-ci \
            -e PULSEWIRE_POSTGRES_PASSWORD="$TEST_DB_PASSWORD" \
            -e PULSEWIRE_POSTGRES_HOST=ci-postgres \
            -e CONFIG_PATH=/app/res/metrics-ci.toml \
            -v "$RUNNER_TEMP/pulsewire-metrics.toml:/app/res/metrics-ci.toml:ro" \
            pulsewire-fetcher:ci --ingest-benchmark 1 \
              > "$RUNNER_TEMP/metrics-unprotected.log" 2>&1; then
            echo "non-loopback metrics unexpectedly accepted no token" >&2
            exit 1
          fi
          grep -q 'requires PULSEWIRE_METRICS_TOKEN_FILE' \
            "$RUNNER_TEMP/metrics-unprotected.log"
          # Fixture credential is never placed in metrics container Env.
          printf '%s\n' 'pw023-private-ci-metrics-token-123456789-abcdef' \
            > "$RUNNER_TEMP/pw023-metrics-token"
          chmod 0644 "$RUNNER_TEMP/pw023-metrics-token"
          docker run -d --name pulsewire-ci-metrics --network pulsewire-ci \
            --memory 512m --memory-swap 512m --cpus 0.75 --pids-limit 256 \
            -e PULSEWIRE_POSTGRES_PASSWORD="$TEST_DB_PASSWORD" \
            -e PULSEWIRE_POSTGRES_HOST=ci-postgres \
            -e PULSEWIRE_ALLOW_PRIVATE_FEEDS=1 \
            -e PULSEWIRE_METRICS_TOKEN_FILE=/run/secrets/pulsewire_metrics_token \
            -e CONFIG_PATH=/app/res/metrics-ci.toml \
            -e FEEDS_DIR=/app/smoke-feeds \
            -v "$RUNNER_TEMP/pw023-metrics-token:/run/secrets/pulsewire_metrics_token:ro" \
            -v "$RUNNER_TEMP/pulsewire-metrics.toml:/app/res/metrics-ci.toml:ro" \
            -v "$RUNNER_TEMP/pulsewire-real-feeds:/app/smoke-feeds:ro" \
            pulsewire-fetcher:ci
          test -z "$(docker port pulsewire-ci-metrics 9898/tcp)"
          metrics_up=0
          for i in {1..30}; do
            if docker exec pulsewire-ci-rss wget -qO- \
              --header="Authorization: Bearer $(cat "$RUNNER_TEMP/pw023-metrics-token")" \
              http://pulsewire-ci-metrics:9898/metrics \
              > "$RUNNER_TEMP/pulsewire-metrics.prom" 2>/dev/null \
              && grep -q '^pulsewire_up 1$' "$RUNNER_TEMP/pulsewire-metrics.prom"; then
              metrics_up=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' pulsewire-ci-metrics)" != true ]; then
              docker logs pulsewire-ci-metrics
              exit 1
            fi
            sleep 2
          done
          test "$metrics_up" = 1
          test -z "$(docker port pulsewire-ci-metrics 9898/tcp)"
          # Same connected DB-side client is denied metrics without
          # the token or with an incorrect token.
          denied="$(docker exec pulsewire-ci-rss wget -S -O /dev/null \
            http://pulsewire-ci-metrics:9898/metrics 2>&1 || true)"
          printf '%s\n' "$denied" | grep -q '401 Unauthorized'
          denied="$(docker exec pulsewire-ci-rss wget -S -O /dev/null \
            --header='Authorization: Bearer incorrect-token' \
            http://pulsewire-ci-metrics:9898/metrics 2>&1 || true)"
          printf '%s\n' "$denied" | grep -q '401 Unauthorized'
          cat > "$RUNNER_TEMP/pulsewire-prometheus.yml" <<'EOF'
          global:
            scrape_interval: 2s
          scrape_configs:
            - job_name: pulsewire-fetcher
              bearer_token_file: /run/secrets/pulsewire_metrics_token
              static_configs:
                - targets: ['pulsewire-ci-metrics:9898']
          EOF
          docker run -d --name pulsewire-ci-prometheus --network pulsewire-ci \
            -v "$RUNNER_TEMP/pulsewire-prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$RUNNER_TEMP/pw023-metrics-token:/run/secrets/pulsewire_metrics_token:ro" \
            prom/prometheus:v3.7.3 \
            --config.file=/etc/prometheus/prometheus.yml \
            --storage.tsdb.path=/prometheus \
            --web.listen-address=0.0.0.0:9090
          # Query Prometheus itself, not only the exported HTTP endpoint.
          seen_up=0
          for i in {1..30}; do
            if docker exec pulsewire-ci-rss wget -qO- \
              'http://pulsewire-ci-prometheus:9090/api/v1/query?query=up%7Bjob%3D%22pulsewire-fetcher%22%7D' \
              2>/dev/null | jq -e \
              '.status == "success" and any(.data.result[]?; .value[1] == "1")' \
              >/dev/null 2>&1; then
              seen_up=1
              break
            fi
            sleep 2
          done
          if [ "$seen_up" -ne 1 ]; then
            docker logs pulsewire-ci-metrics
            docker logs pulsewire-ci-prometheus
            exit 1
          fi
          docker stop pulsewire-ci-metrics
          seen_down=0
          for i in {1..30}; do
            if docker exec pulsewire-ci-rss wget -qO- \
              'http://pulsewire-ci-prometheus:9090/api/v1/query?query=up%7Bjob%3D%22pulsewire-fetcher%22%7D' \
              2>/dev/null | jq -e \
              '.status == "success" and any(.data.result[]?; .value[1] == "0")' \
              >/dev/null 2>&1; then
              seen_down=1
              break
            fi
            sleep 2
          done
          if [ "$seen_down" -ne 1 ]; then
            docker logs pulsewire-ci-prometheus
            exit 1
          fi
          echo "PW-023 authenticated metrics passed: non-loopback fail-closed, anonymous/wrong-token 401, bearer scrape 200, Prometheus up/down"
          # Verify disabled sources produced neither scheduler categories nor feed rows.
          count="$(docker exec -e PGPASSWORD="$TEST_DB_PASSWORD" pulsewire-ci-postgres \
            psql -U admin -d data -Atc "SELECT COUNT(*) FROM fetcher.feeds WHERE category IN ('youtube','podcasts')")"
          test "$count" = 0
          count="$(docker exec -e PGPASSWORD="$TEST_DB_PASSWORD" pulsewire-ci-postgres \
            psql -U admin -d data -Atc "SELECT COUNT(*) FROM fetcher.fetch_events WHERE feed_id = 'pulsewire-ci-real-rss' AND method='GET' AND status=200")"
          test "$count" -ge 1

          # PW-060: real Chromium -> embedded Rust reader -> authenticated
          # PostgreSQL APIs and live ingested RSS. The loopback proxy only
          # injects test assertions; all assets/API requests hit the server.
          PULSEWIRE_READER_E2E_URL=http://127.0.0.1:18091 \
          PULSEWIRE_READER_E2E_PASSWORD="$TEST_ADMIN_PASSWORD" \
          CHROME_BIN=google-chrome node tests/reader-live-smoke.mjs

          token="$(jq -er '.token' "$RUNNER_TEMP/login.json")"
          PULSEWIRE_API_E2E_URL=http://127.0.0.1:18091 \
          PULSEWIRE_API_E2E_TOKEN="$token" \
            bash tests/api-live-contract.sh
          curl -fsS -H "Authorization: Bearer $token" \
            'http://127.0.0.1:18091/v1/entries?feed_id=pulsewire-ci-real-rss' \
            > "$RUNNER_TEMP/entries.json"
          jq -e '(.items | length) >= 2 and any(.items[]; .title == "Pulsewire CI Story One")' \
            "$RUNNER_TEMP/entries.json"
          # Reader API: authentication, subscriptions, favorites and search.
          unauth="$(curl -sS -o /dev/null -w '%{http_code}' \
            'http://127.0.0.1:18091/v1/entries?feed_id=pulsewire-ci-real-rss')"
          test "$unauth" = 401
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"feed_id":"pulsewire-ci-real-rss"}' \
            http://127.0.0.1:18091/v1/subscriptions)"
          test "$code" = 201
          curl -fsS -H "Authorization: Bearer $token" \
            http://127.0.0.1:18091/v1/subscriptions \
            | jq -e 'any(.[]; .feed_id == "pulsewire-ci-real-rss")'
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"feed_id":"pulsewire-ci-real-rss"}' \
            http://127.0.0.1:18091/v1/favorites)"
          test "$code" = 201
          curl -fsS -H "Authorization: Bearer $token" \
            'http://127.0.0.1:18091/v1/entries/search?q=Pulsewire%20CI%20Story' \
            | jq -e '(.items | length) == 2'
          curl -fsS -H "Authorization: Bearer $token" \
            'http://127.0.0.1:18091/v1/entries?read=unread&feed_id=pulsewire-ci-real-rss' \
            | jq -e '(.items | length) == 2'
          item_id="$(jq -er '.items[0].id' "$RUNNER_TEMP/entries.json")"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" \
            "http://127.0.0.1:18091/v1/entries/$item_id/read")"
          test "$code" = 204
          curl -fsS -H "Authorization: Bearer $token" \
            'http://127.0.0.1:18091/v1/entries?read=read&feed_id=pulsewire-ci-real-rss' \
            | jq -e '(.items | length) == 1 and .items[0].is_read'
          curl -fsS -H "Authorization: Bearer $token" \
            'http://127.0.0.1:18091/v1/entries?read=unread&feed_id=pulsewire-ci-real-rss' \
            | jq -e '(.items | length) == 1'
          # Run the actual TUI App and keyboard handlers against the
          # already-seeded disposable PostgreSQL HTTP service. No
          # additional feed ingest or household services are involved.
          PULSEWIRE_TUI_E2E_URL=http://127.0.0.1:18091 \
          PULSEWIRE_TUI_E2E_PASSWORD="$TEST_ADMIN_PASSWORD" \
            cargo test -p pulsewire-tui --locked isolated_http_tui_reader_journey \
              -- --ignored --test-threads=1
          docker restart pulsewire-ci-server
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18091/health >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            "http://127.0.0.1:18091/v1/entries/$item_id/read")"
          test "$code" = 204
          # Confirm the TUI reads stored folder membership and articles
          # after a real server restart on the same disposable database.
          PULSEWIRE_TUI_E2E_URL=http://127.0.0.1:18091 \
          PULSEWIRE_TUI_E2E_PASSWORD="$TEST_ADMIN_PASSWORD" \
            cargo test -p pulsewire-tui --locked isolated_http_tui_after_restart \
              -- --ignored --test-threads=1

          # Backup then restore into a new database: never DROP or overwrite.
          docker exec -e PGPASSWORD="$TEST_DB_PASSWORD" pulsewire-ci-postgres \
            pg_dump -U admin -d data -Fc -f /tmp/pulsewire-ci-backup.dump
          docker exec -e PGPASSWORD="$TEST_DB_PASSWORD" pulsewire-ci-postgres \
            createdb -U admin data_restore
          docker exec -e PGPASSWORD="$TEST_DB_PASSWORD" pulsewire-ci-postgres \
            pg_restore -U admin -d data_restore --no-owner --no-acl --exit-on-error \
            /tmp/pulsewire-ci-backup.dump
          restored="$(docker exec -e PGPASSWORD="$TEST_DB_PASSWORD" pulsewire-ci-postgres \
            psql -U admin -d data_restore -Atc "SELECT COUNT(*) FROM fetcher.feed_items WHERE feed_id = 'pulsewire-ci-real-rss'")"
          test "$restored" -ge 2
          restored_reads="$(docker exec -e PGPASSWORD="$TEST_DB_PASSWORD" pulsewire-ci-postgres \
            psql -U admin -d data_restore -Atc "SELECT COUNT(*) FROM server.entry_states WHERE read_at IS NOT NULL")"
          test "$restored_reads" -ge 1
          restored_subscriptions="$(docker exec -e PGPASSWORD="$TEST_DB_PASSWORD" pulsewire-ci-postgres \
            psql -U admin -d data_restore -Atc "SELECT COUNT(*) FROM server.subscriptions WHERE feed_id = 'pulsewire-ci-real-rss'")"
          test "$restored_subscriptions" -ge 1
          restored_favorites="$(docker exec -e PGPASSWORD="$TEST_DB_PASSWORD" pulsewire-ci-postgres \
            psql -U admin -d data_restore -Atc "SELECT COUNT(*) FROM server.favorites WHERE feed_id = 'pulsewire-ci-real-rss'")"
          test "$restored_favorites" -ge 1
          # Reconcile every preserved table's row count with the
          # original disposable DB: a successful pg_restore is not
          # sufficient if an operational table was silently omitted.
          for table in \
            fetcher.categories fetcher.feeds fetcher.feed_payloads \
            fetcher.feed_items fetcher.feed_state_current \
            fetcher.feed_state_history fetcher.fetch_events \
            server.users server.subscriptions server.entry_states \
            server.favorites server.folders server.folder_feeds; do
            original_count="$(docker exec -e PGPASSWORD="$TEST_DB_PASSWORD" pulsewire-ci-postgres \
              psql -v ON_ERROR_STOP=1 -U admin -d data -Atc "SELECT COUNT(*) FROM $table")"
            restored_count="$(docker exec -e PGPASSWORD="$TEST_DB_PASSWORD" pulsewire-ci-postgres \
              psql -v ON_ERROR_STOP=1 -U admin -d data_restore -Atc "SELECT COUNT(*) FROM $table")"
            test "$original_count" = "$restored_count"
          done
          # Offline operator recovery: invalid confirmation does not connect
          # or mutate the database. A successful recovery kills old sessions.
          prior_hash="$(docker exec -e PGPASSWORD="$TEST_DB_PASSWORD" pulsewire-ci-postgres \
            psql -U admin -d data -Atc "SELECT password_hash FROM server.users WHERE username = 'owner'")"
          if docker run --rm --network pulsewire-ci \
            -e PULSEWIRE_POSTGRES_PASSWORD="$TEST_DB_PASSWORD" \
            -e PULSEWIRE_POSTGRES_HOST=ci-postgres \
            -e PULSEWIRE_ALLOW_PRIVATE_FEEDS=1 \
            -e PULSEWIRE_RECOVERY_CONFIRM=DENIED \
            -e PULSEWIRE_RECOVERY_USERNAME=owner \
            -e PULSEWIRE_RECOVERY_PASSWORD=ci-new-long-password \
            pulsewire-server:ci --recover-user; then
            echo "recovery must reject invalid confirmation" >&2
            exit 1
          fi
          hash_after_denied="$(docker exec -e PGPASSWORD="$TEST_DB_PASSWORD" pulsewire-ci-postgres \
            psql -U admin -d data -Atc "SELECT password_hash FROM server.users WHERE username = 'owner'")"
          test "$prior_hash" = "$hash_after_denied"
          docker exec -e PGPASSWORD="$TEST_DB_PASSWORD" pulsewire-ci-postgres \
            psql -U admin -d data -c "INSERT INTO server.user_password_resets (user_id, token_hash, expires_at, created_at) SELECT id, 'obsolete-ci-reset', NOW() + INTERVAL '1 hour', NOW() FROM server.users WHERE username = 'owner'"
          docker run --rm --network pulsewire-ci \
            -e PULSEWIRE_POSTGRES_PASSWORD="$TEST_DB_PASSWORD" \
            -e PULSEWIRE_POSTGRES_HOST=ci-postgres \
            -e PULSEWIRE_ALLOW_PRIVATE_FEEDS=1 \
            -e PULSEWIRE_RECOVERY_CONFIRM=RECOVER_USER \
            -e PULSEWIRE_RECOVERY_USERNAME=owner \
            -e PULSEWIRE_RECOVERY_PASSWORD=ci-new-long-password \
            pulsewire-server:ci --recover-user
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            'http://127.0.0.1:18091/v1/entries')"
          test "$code" = 401
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"owner\",\"password\":\"$TEST_ADMIN_PASSWORD\"}" \
            http://127.0.0.1:18091/v1/auth/login)"
          test "$code" = 401
          code="$(curl -sS -o "$RUNNER_TEMP/recovered.json" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"username":"owner","password":"ci-new-long-password"}' \
            http://127.0.0.1:18091/v1/auth/login)"
          test "$code" = 200
          jq -e '.token | length > 0' "$RUNNER_TEMP/recovered.json"
          remaining="$(docker exec -e PGPASSWORD="$TEST_DB_PASSWORD" pulsewire-ci-postgres \
            psql -U admin -d data -Atc "SELECT COUNT(*) FROM server.user_password_resets WHERE user_id = (SELECT id FROM server.users WHERE username = 'owner')")"
          test "$remaining" = 0
          role="$(docker exec -e PGPASSWORD="$TEST_DB_PASSWORD" pulsewire-ci-postgres \
            psql -U admin -d data -Atc "SELECT is_admin FROM server.users WHERE username = 'owner'")"
          test "$role" = t

          # Exercise the real HTTP authentication throttle against PostgreSQL.
          # Unknown usernames share the normal invalid-credentials response.
          login_status() {
            jq -nc --arg username "$1" --arg password "$2" \
              '{username:$username,password:$password}' | \
              curl -sS -o /dev/null -w '%{http_code}' \
                -H 'Content-Type: application/json' --data-binary @- \
                http://127.0.0.1:18091/v1/auth/login
          }
          # Password changes must not weaken the 12-byte account policy.
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $(jq -er '.token' "$RUNNER_TEMP/recovered.json")" \
            -H 'Content-Type: application/json' \
            -d '{"current_password":"ci-new-long-password","new_password":"short"}' \
            http://127.0.0.1:18091/v1/users/password)"
          test "$code" = 400
          for attempt in {1..4}; do
            test "$(login_status absent-user incorrect-passphrase)" = 401
          done
          test "$(login_status ABSENT-USER incorrect-passphrase)" = 401
          # A restart cannot bypass persistent, normalized account buckets.
          docker restart pulsewire-ci-server
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18091/health >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          test "$(login_status absent-user incorrect-passphrase)" = 429
          # A blocked unknown account must not prevent an unrelated login.
          test "$(login_status owner ci-new-long-password)" = 200
          for attempt in {1..5}; do
            test "$(login_status owner incorrect-passphrase)" = 401
          done
          # Even a correct password is rejected while its bucket is blocked.
          test "$(login_status owner ci-new-long-password)" = 429
          # Expire fixed windows deterministically without sleeping 15 minutes.
          docker exec -e PGPASSWORD="$TEST_DB_PASSWORD" pulsewire-ci-postgres \
            psql -v ON_ERROR_STOP=1 -U admin -d data -c \
            "UPDATE server.login_rate_limits SET window_started_at = EXTRACT(EPOCH FROM NOW())::BIGINT - 901"
          test "$(login_status owner ci-new-long-password)" = 200
          # Successful login removes the account bucket, allowing five new tries.
          for attempt in {1..5}; do
            test "$(login_status owner incorrect-passphrase)" = 401
          done
          test "$(login_status owner incorrect-passphrase)" = 429

          # Real HTTP token rotation must consume the original bearer.
          prior_bearer="$(jq -er '.token' "$RUNNER_TEMP/recovered.json")"
          code="$(curl -sS -o "$RUNNER_TEMP/rotated.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $prior_bearer" \
            http://127.0.0.1:18091/v1/auth/rotate)"
          test "$code" = 200
          rotated_bearer="$(jq -er '.token' "$RUNNER_TEMP/rotated.json")"
          test "$rotated_bearer" != "$prior_bearer"
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $prior_bearer" \
            http://127.0.0.1:18091/v1/entries)"
          test "$code" = 401
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $rotated_bearer" \
            http://127.0.0.1:18091/v1/entries)"
          test "$code" = 200

          # Different usernames from the same TCP peer share one quota.
          # Run this last because the source quota intentionally blocks
          # later logins until its fixed time window expires.
          source_blocked=0
          for attempt in {1..75}; do
            status="$(login_status "ci-spray-$attempt" incorrect-passphrase)"
            if [ "$status" = 429 ]; then source_blocked=1; break; fi
            test "$status" = 401
          done
          test "$source_blocked" = 1
          test "$(login_status ci-spray-after-limit incorrect-passphrase)" = 429
          # A blocked TCP peer stays blocked when callers forge proxy headers.
          # Each synthetic username is distinct, so its account bucket cannot
          # explain an HTTP 429; only the real peer quota can.
          for fake_ip in 198.51.100.10 198.51.100.11 203.0.113.12; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -H "X-Forwarded-For: $fake_ip" \
              -H "X-Real-IP: $fake_ip" \
              -H "Forwarded: for=$fake_ip" \
              -d "{\"username\":\"ci-spoof-$fake_ip\",\"password\":\"incorrect-passphrase\"}" \
              http://127.0.0.1:18091/v1/auth/login)"
            test "$code" = 429
          done

          # PW-051 SQLite variant: create a completely separate
          # disposable file, ingest the same local RSS fixture, and
          # verify the identical TUI contract on the second backend.
          sqlite_root="$RUNNER_TEMP/pw051-sqlite"
          mkdir -p "$sqlite_root/config/fetcher" \
                   "$sqlite_root/config/server/sql/sqlite" \
                   "$sqlite_root/feeds/news" "$sqlite_root/db"
          chmod 0777 "$sqlite_root/db"
          cp crates/fetcher/res/docker.toml "$sqlite_root/config/fetcher/config.toml"
          cp crates/fetcher/res/domains.toml "$sqlite_root/config/fetcher/domains.toml"
          cp crates/fetcher/res/categories.toml "$sqlite_root/config/fetcher/categories.toml"
          cp crates/server/res/docker.toml "$sqlite_root/config/server/config.toml"
          cp crates/server/res/sql/sqlite/schema.sql \
            "$sqlite_root/config/server/sql/sqlite/schema.sql"
          sed -i 's/^dialect = "postgres"$/dialect = "sqlite"/' \
            "$sqlite_root/config/fetcher/config.toml" \
            "$sqlite_root/config/server/config.toml"
          sed -i 's@^path = "rss.db"$@path = "/app/ci-db/rss.sqlite"@' \
            "$sqlite_root/config/fetcher/config.toml"
          sed -i 's@^path = "res/db/server.sqlite"$@path = "/app/ci-db/rss.sqlite"@' \
            "$sqlite_root/config/server/config.toml"
          cat > "$sqlite_root/feeds/news/ci.toml" <<'EOF'
          [[feeds]]
          id = "pulsewire-ci-real-rss"
          url = "http://ci-rss/feed.xml"
          category = "news"
          base_poll_seconds = 1800
          EOF
          docker run -d --name pulsewire-ci-sqlite-fetcher --network pulsewire-ci \
            -e CONFIG_PATH=/app/ci-config/fetcher/config.toml \
            -e FEEDS_DIR=/app/ci-feeds \
            -e PULSEWIRE_ALLOW_PRIVATE_FEEDS=1 \
            -v "$sqlite_root/config:/app/ci-config:ro" \
            -v "$sqlite_root/feeds:/app/ci-feeds:ro" \
            -v "$sqlite_root/db:/app/ci-db" \
            pulsewire-fetcher:ci
          for i in {1..30}; do
            if test -s "$sqlite_root/db/rss.sqlite"; then break; fi
            sleep 2
          done
          test -s "$sqlite_root/db/rss.sqlite"
          # Bootstrap only this new SQLite file; the PostgreSQL CI
          # database and the operator's machine remain untouched.
          docker run --rm --network pulsewire-ci \
            -e SERVER_CONFIG_PATH=/app/ci-config/server/config.toml \
            -e PULSEWIRE_BOOTSTRAP_USERNAME=owner \
            -e PULSEWIRE_BOOTSTRAP_PASSWORD="$TEST_ADMIN_PASSWORD" \
            -v "$sqlite_root/config:/app/ci-config:ro" \
            -v "$sqlite_root/db:/app/ci-db" \
            pulsewire-server:ci --bootstrap-admin
          docker run -d --name pulsewire-ci-sqlite-server \
            --network pulsewire-ci -p 127.0.0.1:18092:8091 \
            -e SERVER_CONFIG_PATH=/app/ci-config/server/config.toml \
            -v "$sqlite_root/config:/app/ci-config:ro" \
            -v "$sqlite_root/db:/app/ci-db" \
            pulsewire-server:ci
          sqlite_ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18092/health >/dev/null 2>&1; then
              sqlite_ready=1
              break
            fi
            sleep 2
          done
          if test "$sqlite_ready" -ne 1; then
            docker logs pulsewire-ci-sqlite-server
            exit 1
          fi
          sqlite_token="$(jq -nc --arg username owner \
            --arg password "$TEST_ADMIN_PASSWORD" \
            '{username:$username,password:$password}' | \
            curl -fsS -H 'Content-Type: application/json' --data-binary @- \
              http://127.0.0.1:18092/v1/auth/login | jq -er '.token')"
          sqlite_fetched=0
          for i in {1..45}; do
            count="$(curl -fsS -H "Authorization: Bearer $sqlite_token" \
              http://127.0.0.1:18092/v1/entries | jq -r '.items | length' || echo 0)"
            if test "$count" -ge 2; then sqlite_fetched=1; break; fi
            if test "$(docker inspect -f '{{.State.Running}}' pulsewire-ci-sqlite-fetcher)" != true; then
              docker logs pulsewire-ci-sqlite-fetcher
              exit 1
            fi
            sleep 2
          done
          if test "$sqlite_fetched" -ne 1; then
            docker logs pulsewire-ci-sqlite-fetcher
            exit 1
          fi
          docker stop pulsewire-ci-sqlite-fetcher
          PULSEWIRE_API_E2E_URL=http://127.0.0.1:18092 \
          PULSEWIRE_API_E2E_TOKEN="$sqlite_token" \
            bash tests/api-live-contract.sh
          PULSEWIRE_TUI_E2E_URL=http://127.0.0.1:18092 \
          PULSEWIRE_TUI_E2E_PASSWORD="$TEST_ADMIN_PASSWORD" \
            cargo test -p pulsewire-tui --locked isolated_http_tui_reader_journey \
              -- --ignored --test-threads=1
          docker restart pulsewire-ci-sqlite-server
          sqlite_ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18092/health >/dev/null 2>&1; then
              sqlite_ready=1
              break
            fi
            sleep 2
          done
          test "$sqlite_ready" = 1
          PULSEWIRE_TUI_E2E_URL=http://127.0.0.1:18092 \
          PULSEWIRE_TUI_E2E_PASSWORD="$TEST_ADMIN_PASSWORD" \
            cargo test -p pulsewire-tui --locked isolated_http_tui_after_restart \
              -- --ignored --test-threads=1
          # PW-023: a mounted password file must work with BOTH actual
          # binaries, without putting secret bytes in Docker Env metadata.
          printf '%s\n' "$TEST_DB_PASSWORD" > "$RUNNER_TEMP/pw023-runtime-secret"
          chmod 0644 "$RUNNER_TEMP/pw023-runtime-secret"
          docker run --rm --network pulsewire-ci \
            -e PULSEWIRE_POSTGRES_HOST=ci-postgres \
            -e PULSEWIRE_POSTGRES_PASSWORD_FILE=/run/secrets/pulsewire_postgres_password \
            -e PULSEWIRE_ALLOW_PRIVATE_FEEDS=1 \
            -e FEEDS_DIR=/app/ci-feeds \
            -v "$RUNNER_TEMP/pw023-runtime-secret:/run/secrets/pulsewire_postgres_password:ro" \
            -v "$RUNNER_TEMP/pulsewire-real-feeds:/app/ci-feeds:ro" \
            pulsewire-fetcher:ci --ingest-benchmark 1
          docker run -d --name pulsewire-ci-secret-server --network pulsewire-ci \
            -p 127.0.0.1:18093:8091 \
            -e PULSEWIRE_POSTGRES_HOST=ci-postgres \
            -e PULSEWIRE_POSTGRES_PASSWORD_FILE=/run/secrets/pulsewire_postgres_password \
            -v "$RUNNER_TEMP/pw023-runtime-secret:/run/secrets/pulsewire_postgres_password:ro" \
            pulsewire-server:ci
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18093/ready >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18093/health
          curl -fsS http://127.0.0.1:18093/ready
          if docker inspect -f '{{json .Config.Env}}' pulsewire-ci-secret-server | \
            grep -F "$TEST_DB_PASSWORD"; then
            echo "DB secret leaked through container environment" >&2
            exit 1
          fi
          test "$(docker port pulsewire-ci-secret-server 8091/tcp)" = '127.0.0.1:18093'
          docker rm -f pulsewire-ci-secret-server
          # Explicit file failure must reject startup with a generic
          # error; no insecure fallback and no password in diagnostics.
          if docker run --rm --network pulsewire-ci \
            -e PULSEWIRE_POSTGRES_HOST=ci-postgres \
            -e PULSEWIRE_POSTGRES_PASSWORD_FILE=/run/secrets/missing \
            pulsewire-server:ci > "$RUNNER_TEMP/pw023-bad-secret.log" 2>&1; then
            echo "Missing password file unexpectedly accepted" >&2
            exit 1
          fi
          grep -qi 'password file' "$RUNNER_TEMP/pw023-bad-secret.log"
          if grep -F "$TEST_DB_PASSWORD" "$RUNNER_TEMP/pw023-bad-secret.log"; then
            echo "Secret included in error log" >&2
            exit 1
          fi
          echo "PW-023 file-backed credentials: both real binaries passed against disposable PostgreSQL"
          # PW-023: disposable TLS edge plus distinct-peer spoofing and
          # network-bypass regressions, using the real reader and database.
          bash tests/pw023-ingress-smoke.sh
