name: Nix flake packaging

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Verify committed Nix input lock
        shell: bash
        run: |
          set -euo pipefail
          nix flake lock
          # Lock JSON is public dependency provenance, not an application secret.
          # Printing this once also lets maintainers bootstrap an initial lock
          # from CI without letting workflows push to the repository.
          printf '\n--- BEGIN NIX FLAKE LOCK ---\n'
          cat flake.lock
          printf '\n--- END NIX FLAKE LOCK ---\n'
          if test -n "$(git status --porcelain -- flake.lock)"; then
            echo 'ERROR: commit the generated flake.lock before merging' >&2
            exit 1
          fi
      - name: Generate crate2nix graph for initial pinning
        shell: bash
        run: |
          set -euo pipefail
          nix run github:nix-community/crate2nix/1cb60331b14f15dad145dbd4e207c1ec110e5675 -- generate -f Cargo.toml -o Cargo.nix
          test -s Cargo.nix
          echo '=== BEGIN CARGO-NIX-GZIP-BASE64 ==='
          gzip -9 -c Cargo.nix | base64 -w0
          echo
          echo '=== END CARGO-NIX-GZIP-BASE64 ==='
      - name: Evaluate flake outputs
        run: nix flake check --no-build --no-update-lock-file
      - name: Verify pinned developer toolchain
        run: nix develop .#default --command bash -c 'cargo --version && rustc --version && node --version'
      # crate2nix builds each third-party crate as a separate derivation.
      # The workspace build below exercises the complete per-crate graph.
      - name: Build all four Rust executables and versioned runtime assets
        run: nix build .#default --no-link --no-update-lock-file
      - name: Check split package outputs and installed resources
        shell: bash
        run: |
          set -euo pipefail
          for package in fetcher server cli tui; do
            nix build ".#$package" --out-link "result-$package" --no-update-lock-file
          done
          test -x result-fetcher/bin/pulsewire
          test -x result-server/bin/pulsewire-server
          test -x result-cli/bin/pulsewire-cli
          test -x result-tui/bin/pulsewire-tui
          test -f result-fetcher/share/pulsewire/config/fetcher/config.toml
          test -f result-server/share/pulsewire/schemas/server/sql/postgres/schema.sql
          test -f result-tui/share/pulsewire/schemas/tui/tui.schema.json
          test ! -e result-fetcher/share/pulsewire/config/fetcher/feeds/podcasts
          test ! -e result-fetcher/share/pulsewire/config/fetcher/feeds/youtube.com
