# Optional overlay: use only with the matching base Compose file.
# See docs/pulsewire/SECRETS.md. Requires a private, preexisting file.
services:
  fetcher:
    environment:
      PULSEWIRE_POSTGRES_PASSWORD: ""
      PULSEWIRE_POSTGRES_PASSWORD_FILE: /run/secrets/pulsewire_postgres_password
    secrets:
      - pulsewire_postgres_password

secrets:
  pulsewire_postgres_password:
    file: ${PULSEWIRE_POSTGRES_PASSWORD_SOURCE:?Set a private DB password file path}
