services:
  fetcher:
    build:
      context: ../..
      dockerfile: crates/fetcher/Dockerfile
      args:
        TARGET: x86_64-unknown-linux-musl
    image: guzmansalv/pulsewire-fetcher:latest
    container_name: guzmansalv-pulsewire-fetcher
    restart: on-failure:5
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "0.75"
    pids_limit: 256
    environment:
      CONFIG_PATH: /app/res/docker.toml
      FEEDS_DIR: /app/res/feeds
      SCHEMAS_DIR: /app/schemas/fetcher
      PULSEWIRE_POSTGRES_PASSWORD: ${PULSEWIRE_POSTGRES_PASSWORD:?Set PULSEWIRE_POSTGRES_PASSWORD for Pulsewire}
      PULSEWIRE_POSTGRES_HOST: ${PULSEWIRE_POSTGRES_HOST:-postgres}
    volumes:
      - ./res/docker.toml:/app/res/docker.toml:ro
      - ./res/domains.toml:/app/res/domains.toml:ro
      - ./res/categories.toml:/app/res/categories.toml:ro
      - ./res/feeds:/app/res/feeds:ro
      - ../../cookies:/app/cookies:ro
      - ../../headers:/app/headers:ro
    # Metrics disabled by default: no published port.
    # Enable only with a reviewed, privately bound monitoring config.
    networks:
      - pulsewire_services

networks:
  pulsewire_services:
    external: true
    name: ${PULSEWIRE_DOCKER_NETWORK:?Set PULSEWIRE_DOCKER_NETWORK to a network shared with PostgreSQL}
