services:
  server:
    build:
      context: ../..
      dockerfile: crates/server/Dockerfile
      args:
        TARGET: x86_64-unknown-linux-musl
    image: guzmansalv/pulsewire-server:latest
    container_name: guzmansalv-pulsewire-server
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.25"
    pids_limit: 128
    environment:
      SERVER_CONFIG_PATH: /app/res/docker.toml
      SCHEMAS_DIR: /app/schemas/server
      PULSEWIRE_POSTGRES_PASSWORD: ${PULSEWIRE_POSTGRES_PASSWORD:?Set PULSEWIRE_POSTGRES_PASSWORD for Pulsewire}
      PULSEWIRE_POSTGRES_HOST: ${PULSEWIRE_POSTGRES_HOST:-postgres}
    volumes:
      - ./res:/app/res:ro
    ports:
      - "127.0.0.1:8091:8091"
    networks:
      - pulsewire_services

networks:
  pulsewire_services:
    external: true
    name: ${PULSEWIRE_DOCKER_NETWORK:?Set PULSEWIRE_DOCKER_NETWORK to a network shared with PostgreSQL}
