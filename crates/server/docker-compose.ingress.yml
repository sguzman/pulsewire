# PW-023 opt-in loopback-only TLS ingress overlay.
# Use with crates/server/docker-compose.yml; never deploy without approval.
services:
  server:
    ports: !reset []
    networks:
      - pulsewire_services
      - pulsewire_ingress_private

  edge_proxy:
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    depends_on:
      - server
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - ../../deploy/pw023/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PULSEWIRE_TLS_CERT_SOURCE:?Supply a private TLS certificate}:/etc/nginx/tls/cert.pem:ro
      - ${PULSEWIRE_TLS_KEY_SOURCE:?Supply a private TLS key}:/etc/nginx/tls/key.pem:ro
    ports:
      - "127.0.0.1:${PULSEWIRE_TLS_LOOPBACK_PORT:-8443}:8443"
    networks:
      - pulsewire_ingress_private
      - pulsewire_edge

networks:
  pulsewire_ingress_private:
    internal: true
  pulsewire_edge: {}
