# PW-023 optional loopback-only TLS ingress, not a public deployment.
# Rate limits use the actual TCP peer; DO NOT trust arbitrary X-Forwarded-For.
limit_req_zone $binary_remote_addr zone=pulsewire_login:1m rate=1r/s;

server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    access_log off;
    error_log /dev/stderr warn;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    limit_req_status 429;
    client_max_body_size 1m;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_http_version 1.1;

    # Strip spoofed forwarding headers, without promoting them to trust.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";

    location = /v1/auth/login {
        limit_req zone=pulsewire_login burst=3 nodelay;
        client_max_body_size 16k;
        proxy_pass http://server:8091;
    }
    location ^~ /v1/ {
        proxy_pass http://server:8091;
    }
    location = /reader {
        proxy_pass http://server:8091;
    }
    location ^~ /reader/ {
        proxy_pass http://server:8091;
    }
    # Deliberately exclude /health, /ready, /docs, /openapi.json, /metrics.
    location / {
        return 404;
    }
}
